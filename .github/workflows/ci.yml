name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push supersedes the run before it, instead of three piling up on one branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # raylib links against X11 on Linux; the runners ship none of it.
      - name: Install X11 development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      # Keyed on the dependency pins, not the whole of CMakeLists.txt, and with
      # a fallback so an edit still starts from a warm cache. macOS builds two
      # copies of raylib and every miss cost it twenty minutes.
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/cpm-cache
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake', 'cmake/get_cpm.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Point CPM at the cached sources
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$HOME/cpm-cache" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      # Every header compiled on its own. A header that leans on its includers
      # passes on one toolchain and fails on another.
      - name: Check headers are self-contained
        run: cmake --build build --config RelWithDebInfo --target td_headers

      # The whole suite runs without a display: td_tests never links raylib, and
      # the rendering tests use raylib's software backend.
      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure
