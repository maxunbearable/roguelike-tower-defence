name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Ships with the procedurally generated art: the sprite packs may not be
      # redistributed, so a release built from this repository alone looks like
      # the prototype. Run tools/import_*.py before packaging a real build.
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist
        working-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: wardstone-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
