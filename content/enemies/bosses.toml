# --- wave-40 bosses -------------------------------------------------------
#
# A third boss per map, between the wave-25 mid-boss and the wave-50 final. The
# gap from 25 to 50 was the longest stretch of the run with no set-piece in it.
#
# These use the MONSTER sprites rather than a retinted troop, so a boss no longer
# looks like a big goblin -- and each one is the creature its map's roster is
# built around, drawn at 2x.
#
# HP sits between the mid-boss and the final: at wave 40 the curve is well short
# of its wave-50 value, so ~2.2x a mid-boss base is about 5x a regular enemy of
# that wave. Each resists its map's favoured element, like every other boss here.

