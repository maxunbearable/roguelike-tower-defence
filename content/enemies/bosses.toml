# Bosses: one mid-boss at wave 25 and one final boss at wave 50 per map.
#
# HP is chosen against the curve, not by feel. At wave 50 greenfields' hpMult is
# roughly 198x, so a 160hp goblin arrives with ~31,700. A final boss at base
# 1200 lands at ~238,000 -- about 7x a regular enemy of the same wave, which is
# what makes it a wall rather than a speed bump. Mid-bosses sit at ~4x.
#
# Every boss is slow and heavily armoured: the threat is that it does not stop,
# so the answer has to be damage rather than crowd control.
#
# `resist` is the reason five maps replay differently. Each map's bosses resist
# the element its whole roster leans on, so the build that cleared the last map
# is the wrong build here.

# --- greenfields: no bias, the tutorial boss ------------------------------
[[enemy]]
id = "boss_ogre_warlord"
name = "Ogre Warlord"
maxHp = 640.0
armor = 12.0
speed = 0.95
bounty = 108
shardValue = 8
flying = false
boss = true

