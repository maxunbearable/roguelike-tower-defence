# The monster roster: ten creatures from the CraftPix monster pack.
#
# Why these exist: the roster was four archetypes (slime, wolf, goblin, wraith)
# re-tinted five ways, so every map fought the same four silhouettes in different
# colours. These are ten genuinely different creatures.
#
# FIVE OF THEM FLY. That is not decoration -- the pack ships Fly/Fall sequences
# for monsters 1-5 and Walking/Jump for 6-10, and the renderer already hovers a
# flier, animates it off wall-clock time rather than distance travelled, and
# draws it a ground shadow. `flying` had been declared on EnemyDef and set by
# nothing.
#
# Resistances follow the silhouette, so a player can learn them by looking:
# insects are frail but fast and resist piercing (small, hard to hit squarely);
# armoured crawlers resist siege; things on fire resist fire.

# --- fliers ---------------------------------------------------------------

[[enemy]]
id = "bloodgnat"
name = "Bloodgnat"
maxHp = 26.0
armor = 0.0
speed = 3.1
bounty = 4
shardValue = 0
flying = true
sprite = "bloodgnat"
resist = { piercing = 0.55, fire = 1.4 }   # too small to hit, too dry to survive a spark

