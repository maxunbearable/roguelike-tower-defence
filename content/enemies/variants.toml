# GENERATED-STYLE per-map rosters. Each map fields the same four creature
# shapes, so they reuse the four imported sprite sets via `sprite`, but with
# different resistances and a different tint.
#
# This is what makes five maps replay differently rather than being one map five
# times: the build that cleared the last map is the wrong build here. The theme
# resistance is MERGED with each creature's own quirk, so a goblin is still
# earth-hardened and a wraith still earth-bound wherever it appears.


