[tree]
id = "cannon"
kind = "tower"
specs = ["mortar", "bombard", "siege"]

# The cannon's three specs are the same weapon at three ranges of engagement.
# All three splash; what differs is how hard, how often and how far.

[[node]]
id = "cannon.unlock"
name = "Siege Charter"
desc = "Unlocks the Cannon: slow, heavy shells that damage a whole cluster."
branch = "trunk"
cost = 22
requires = []
pos = [0, -1]
modifiers = [{ target = "cannon.damage", op = "mult", value = 1.05 }]

[[node]]
id = "cannon.trunk.dmg1"
name = "Packed Charge"
desc = "+10% shell damage"
branch = "trunk"
cost = 11
requires = ["cannon.unlock"]
pos = [0, 0]
modifiers = [{ target = "cannon.damage", op = "mult", value = 1.1 }]

[[node]]
id = "cannon.trunk.rate1"
name = "Drilled Crew"
desc = "+10% fire rate"
branch = "trunk"
cost = 14
requires = ["cannon.trunk.dmg1"]
pos = [0, 1]
modifiers = [{ target = "cannon.fireRate", op = "mult", value = 1.1 }]

[[node]]
id = "cannon.trunk.range1"
name = "Longer Barrel"
desc = "+0.5 tiles range"
branch = "trunk"
cost = 14
requires = ["cannon.trunk.dmg1"]
pos = [1, 1]
modifiers = [{ target = "cannon.range", op = "add", value = 0.5 }]

[[node]]
id = "cannon.mortar.core"
name = "Mortar"
desc = "Lobs from far off. The widest blast on the board."
branch = "mortar"
cost = 36
requires = ["cannon.trunk.rate1"]
pos = [-2, 2]
modifiers = [
  { target = "cannon.trait.splash", op = "flag" },
  { target = "cannon.splash.radius", op = "set", value = 2.2 },
  { target = "cannon.splash.damagePct", op = "set", value = 0.7 },
  { target = "cannon.splash.falloff", op = "set", value = 0.45 },
  { target = "cannon.damage", op = "mult", value = 1.3 },
  { target = "cannon.fireRate", op = "mult", value = 0.7 },
  { target = "cannon.range", op = "mult", value = 1.5 },
]

[[node]]
id = "cannon.mortar.wide"
name = "Airburst"
desc = "+0.6 tiles blast radius"
branch = "mortar"
cost = 29
requires = ["cannon.mortar.core"]
pos = [-3, 3]
modifiers = [{ target = "cannon.splash.radius", op = "add", value = 0.6 }]

[[node]]
id = "cannon.mortar.far"
name = "Spotter"
desc = "+1.2 tiles range"
branch = "mortar"
cost = 29
requires = ["cannon.mortar.core"]
pos = [-2, 3]
modifiers = [{ target = "cannon.range", op = "add", value = 1.2 }]

[[node]]
id = "cannon.bombard.core"
name = "Bombard"
desc = "Rapid short-range shells. Small blasts, constantly."
branch = "bombard"
cost = 36
requires = ["cannon.trunk.rate1"]
pos = [0, 2]
modifiers = [
  { target = "cannon.trait.splash", op = "flag" },
  { target = "cannon.splash.radius", op = "set", value = 1.2 },
  { target = "cannon.splash.damagePct", op = "set", value = 0.45 },
  { target = "cannon.splash.falloff", op = "set", value = 0.5 },
  { target = "cannon.damage", op = "mult", value = 0.7 },
  { target = "cannon.fireRate", op = "mult", value = 2.2 },
  { target = "cannon.range", op = "mult", value = 0.85 },
]

[[node]]
id = "cannon.bombard.fast"
name = "Autoloader"
desc = "+30% fire rate"
branch = "bombard"
cost = 29
requires = ["cannon.bombard.core"]
pos = [-1, 3]
modifiers = [{ target = "cannon.fireRate", op = "mult", value = 1.3 }]

[[node]]
id = "cannon.bombard.hard"
name = "Fragmentation"
desc = "+40% blast damage"
branch = "bombard"
cost = 29
requires = ["cannon.bombard.core"]
pos = [0, 3]
modifiers = [{ target = "cannon.splash.damagePct", op = "mult", value = 1.4 }]

[[node]]
id = "cannon.siege.core"
name = "Siege"
desc = "One enormous shell. Demolishes armour."
branch = "siege"
cost = 36
requires = ["cannon.trunk.range1"]
pos = [2, 2]
modifiers = [
  { target = "cannon.trait.splash", op = "flag" },
  { target = "cannon.splash.radius", op = "set", value = 1.5 },
  { target = "cannon.splash.damagePct", op = "set", value = 0.6 },
  { target = "cannon.damage", op = "mult", value = 2.8 },
  { target = "cannon.fireRate", op = "mult", value = 0.45 },
  { target = "cannon.armorPen", op = "add", value = 14.0 },
]

[[node]]
id = "cannon.siege.pen"
name = "Breaching Shot"
desc = "+10 armour penetration: ignores that much enemy armour"
branch = "siege"
cost = 29
requires = ["cannon.siege.core"]
pos = [2, 3]
modifiers = [{ target = "cannon.armorPen", op = "add", value = 10.0 }]

[[node]]
id = "cannon.siege.dmg"
name = "Siegebreaker"
desc = "+45% shell damage"
branch = "siege"
cost = 29
requires = ["cannon.siege.core"]
pos = [3, 3]
modifiers = [{ target = "cannon.damage", op = "mult", value = 1.45 }]
