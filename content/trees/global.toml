# --- abilities -------------------------------------------------------------
#
# Strike and Ward were the only capability in the game a player could not
# improve. Everything else -- tower levels, elements, both kinds of
# specialisation, tower types themselves -- is bought here, while the two
# abilities were fixed constants identical on run 1 and run 200.
#
# The axes follow Kingdom Rush, which upgrades its Rain of Fire by damage,
# explosion radius and a flat cooldown reduction. Cooldowns are reduced by whole
# seconds rather than by a percentage: a multiplier compounds badly across a long
# tree, and World clamps them so no amount of investment makes an ability free.

[[node]]
id = "global.strike1"
name = "Focused Charge"
desc = "The Strike hits harder."
branch = "trunk"
cost = 54
requires = ["global.level2"]
pos = [4, 1]
modifiers = [{ target = "global.strike.damage", op = "mult", value = 1.35 }]

[[node]]
id = "global.strike2"
name = "Wider Impact"
desc = "The Strike covers more ground."
