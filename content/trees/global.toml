[tree]
id = "global"
kind = "global"
specs = []

# The global tree is the spine of the meta progression: it unlocks what a tower
# is ALLOWED to do (levels 2 and 3) and then raises every tower type at once.
#
# Offence nodes carry one modifier per tower id rather than a single "all towers"
# target, because the stat system resolves per tower and a wildcard would be a
# special case in the resolver for the sake of shorter TOML.

[[node]]
id = "global.level2"
name = "Reinforced Foundations"
desc = "Unlocks tower level 2. Without it every tower stays at level 1."
branch = "trunk"
cost = 14
requires = []
pos = [0, 0]
modifiers = [{ target = "global.unlock.level2", op = "flag" }]

[[node]]
id = "global.level3"
name = "Master Masonry"
desc = "Unlocks tower level 3, which every specialisation requires."
branch = "trunk"
