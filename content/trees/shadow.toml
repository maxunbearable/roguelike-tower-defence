[tree]
id = "shadow"
kind = "element"
specs = ["wither", "siphon", "rift"]

# Shadow is attrition. Nothing here helps with the enemy in front of you; all
# three specs make every enemy after it worse off.

[[node]]
id = "shadow.trunk.potency"
name = "Gathering Dark"
desc = "+15% Shadow effect magnitude"
branch = "trunk"
cost = 12
requires = []
pos = [0, 0]
modifiers = [{ target = "shadow.potency", op = "mult", value = 1.15 }]

[[node]]
id = "shadow.trunk.duration"
name = "Long Night"
desc = "+20% Shadow effect duration"
branch = "trunk"
cost = 15
requires = ["shadow.trunk.potency"]
pos = [0, 1]
modifiers = [{ target = "shadow.duration", op = "mult", value = 1.2 }]

[[node]]
id = "shadow.wither.core"
name = "Wither"
desc = "Hits permanently weaken the target for the whole wave."
branch = "wither"
cost = 36
requires = ["shadow.trunk.duration"]
pos = [-2, 2]
modifiers = [{ target = "shadow.wither.pctPerHit", op = "mult", value = 1.0 }]

[[node]]
id = "shadow.wither.fast"
name = "Rot"
desc = "+60% withering per hit"
branch = "wither"
cost = 29
requires = ["shadow.wither.core"]
pos = [-2, 3]
modifiers = [{ target = "shadow.wither.pctPerHit", op = "mult", value = 1.6 }]

[[node]]
id = "shadow.wither.deep"
name = "Consumption"
desc = "Raises the withering cap to 65%"
branch = "wither"
cost = 29
requires = ["shadow.wither.core"]
pos = [-3, 3]
modifiers = [{ target = "shadow.wither.maxPct", op = "set", value = 0.65 }]

[[node]]
id = "shadow.siphon.core"
name = "Siphon"
desc = "Kills sometimes return a life, and always a little gold."
branch = "siphon"
cost = 36
requires = ["shadow.trunk.duration"]
pos = [0, 2]
modifiers = [{ target = "shadow.siphon.lifeChance", op = "mult", value = 1.0 }]

[[node]]
id = "shadow.siphon.often"
name = "Blood Price"
desc = "+3% chance to reclaim a life"
branch = "siphon"
cost = 29
requires = ["shadow.siphon.core"]
pos = [0, 3]
modifiers = [{ target = "shadow.siphon.lifeChance", op = "add", value = 0.03 }]

[[node]]
id = "shadow.siphon.gold"
name = "Grave Tithe"
desc = "+3 gold per kill this tower lands"
branch = "siphon"
cost = 29
requires = ["shadow.siphon.core"]
pos = [1, 3]
modifiers = [{ target = "shadow.siphon.goldPerKill", op = "add", value = 3.0 }]

[[node]]
id = "shadow.rift.core"
name = "Rift"
desc = "A kill tears a rift that keeps burning what follows."
branch = "rift"
cost = 36
requires = ["shadow.trunk.duration"]
pos = [2, 2]
modifiers = [{ target = "shadow.rift.dps", op = "mult", value = 1.0 }]

[[node]]
id = "shadow.rift.hard"
name = "Void Tear"
desc = "+50% rift damage"
branch = "rift"
cost = 29
requires = ["shadow.rift.core"]
pos = [2, 3]
modifiers = [{ target = "shadow.rift.dps", op = "mult", value = 1.5 }]

[[node]]
id = "shadow.rift.wide"
name = "Yawning Gate"
desc = "+0.7 tiles rift radius, +2s duration"
branch = "rift"
cost = 29
requires = ["shadow.rift.core"]
pos = [3, 3]
modifiers = [
  { target = "shadow.rift.radius", op = "add", value = 0.7 },
  { target = "shadow.rift.duration", op = "add", value = 2.0 },
]
